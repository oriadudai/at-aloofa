name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        run: gradle :app:assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/at-aloofa.apk
      - uses: actions/upload-artifact@v4
        with:
          name: at-aloofa-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: את אלופה
          make_latest: true
          files: app/build/outputs/apk/debug/at-aloofa.apk
